version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: gxpchat
      POSTGRES_USER: gxp
      POSTGRES_PASSWORD: gxp
    ports: ["5432:5432"]
  agent:
    build: ./agent
    ports: ["8000:8000"]
    env_file: ./agent/.env
    depends_on: [qdrant, postgres]
